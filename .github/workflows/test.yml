name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate runner scripts
        run: bash -n .github/scripts/*.sh
      - name: Cache dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if deno task cache; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Dependency fetch failed; retrying (${attempt}/3)..."
              sleep "$((attempt * 5))"
            fi
          done
          echo "Dependency fetch failed after 3 attempts."
          exit 1
      - name: Lint
        run: deno lint
      - name: Run tests
        run: deno task test
      - name: Run tests with coverage
        run: deno task test:coverage | tee coverage.txt
      - name: Publish coverage to Step Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Test coverage"
            echo ""
            echo '```'
            if [[ -f coverage.txt ]]; then
              cat coverage.txt
            else
              echo "(coverage report not produced)"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Generate lcov report
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d coverage ]]; then
            deno coverage coverage --lcov > coverage.lcov
          else
            echo "(coverage/ not produced; skipping lcov generation)"
          fi
      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.lcov
          flags: deno
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
