name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge validated patch and minor updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "${GITHUB_EVENT_PATH}")"
          if [[ -z "${pr_number}" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          author="$(jq -r '.user.login' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base="$(jq -r '.base.ref' <<<"${pr_json}")"
          current_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          body="$(jq -r '.body // ""' <<<"${pr_json}")"

          if [[ "${author}" != "dependabot[bot]" || "${state}" != "open" || "${draft}" != "false" || "${base}" != "master" ]]; then
            echo "PR is no longer an eligible Dependabot PR; skipping."
            exit 0
          fi

          if [[ "${current_sha}" != "${RUN_HEAD_SHA}" ]]; then
            echo "PR head changed after the successful test run; waiting for the newer run."
            exit 0
          fi

          update_types="$(grep -oE 'update-type: version-update:semver-(patch|minor|major)' <<<"${body}" | sed 's/^update-type: //' | sort -u || true)"

          if [[ -z "${update_types}" ]]; then
            echo "Could not determine Dependabot update type; leaving for manual review."
            exit 0
          fi

          if grep -q 'version-update:semver-major' <<<"${update_types}"; then
            echo "Major update detected; leaving for manual review."
            exit 0
          fi

          if grep -Evq '^version-update:semver-(patch|minor)$' <<<"${update_types}"; then
            echo "Unknown update type detected; leaving for manual review."
            exit 0
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -f merge_method=squash \
            -f sha="${current_sha}"
