name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated PR
        id: resolve
        shell: bash
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "${GITHUB_EVENT_PATH}")"
          if [[ -z "${pr_number}" ]]; then
            echo "No pull request is associated with this workflow run."
            echo "pr_number=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "expected_head_sha=${RUN_HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted gate code
        if: steps.resolve.outputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Route PR with Jev
        if: steps.resolve.outputs.pr_number != ''
        id: jev
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.resolve.outputs.expected_head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL || 'typesafe-ai/jev' }}
          JEV_MIN_CONFIDENCE: ${{ vars.JEV_MIN_CONFIDENCE || '0.40' }}
          JEV_MIN_AUTO_PROBABILITY: ${{ vars.JEV_MIN_AUTO_PROBABILITY || '0.60' }}
          JEV_MIN_AUTO_MARGIN: ${{ vars.JEV_MIN_AUTO_MARGIN || '0.20' }}
        run: node .github/scripts/jev-pr-gate.mjs

      - name: Leave PR for deeper review
        if: steps.resolve.outputs.pr_number != '' && steps.jev.outputs.route != 'AUTO_MERGE'
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          echo "Jev routed PR #${PR_NUMBER} to ${{ steps.jev.outputs.route }}."
          echo "Automatic merge is intentionally skipped."

      - name: Merge Jev-approved update
        if: steps.resolve.outputs.pr_number != '' && steps.jev.outputs.route == 'AUTO_MERGE'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.resolve.outputs.expected_head_sha }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base="$(jq -r '.base.ref' <<<"${pr_json}")"
          current_sha="$(jq -r '.head.sha' <<<"${pr_json}")"

          if [[ "${author}" != "dependabot[bot]" || "${state}" != "open" || "${draft}" != "false" || "${base}" != "master" ]]; then
            echo "PR is no longer an eligible Dependabot PR; skipping."
            exit 0
          fi

          if [[ "${current_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "PR head changed after Jev review; waiting for the newer Test run."
            exit 0
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${EXPECTED_HEAD_SHA}"
