name: ThreadDownloaderAction
on:
  repository_dispatch:
    types:
      - thread-download

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Build matrix from links
        id: set-matrix
        shell: bash
        run: |
          matrix="$(jq -c '{include: [.client_payload.links | to_entries[] | {index: ((.key + 1) | tostring | if length < 2 then ("0" + .) else . end), link: .value.link, message: .value.message}]}' "${GITHUB_EVENT_PATH}")"
          count="$(jq -r '.client_payload.links | length' "${GITHUB_EVENT_PATH}")"
          {
            printf 'matrix=%s\n' "${matrix}"
            printf 'count=%s\n' "${count}"
          } >> "${GITHUB_OUTPUT}"
          printf 'Prepared %s download(s).\n' "${count}"

  run-with-container:
    name: 'Download #${{ matrix.index }}'
    needs: [prepare]
    if: ${{ fromJson(needs.prepare.outputs.count) > 0 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/tw-dl-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Masking Secrets
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh mask
      - name: Start Steps
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh start
      - name: Setup latest yt-dlp
        if: ${{ success() }}
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh setup
      - name: Install scripts
        if: ${{ success() }}
        run: bash .github/scripts/run.sh install
      - name: Confirmation of link survival
        if: ${{ success() }}
        id: link_status
        timeout-minutes: 10
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh check-link
      - name: Start Download
        if: ${{ success() }}
        id: download
        timeout-minutes: 10
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: bash .github/scripts/run.sh download
      - name: Check and Convert Files
        if: ${{ success() }}
        uses: ./.github/actions/check-and-convert-files
        with:
          endpoint_url: ${{ secrets.ENDPOINT_URL }}
          run_number: ${{ github.run_number }}
          command_type: ${{ github.event.client_payload.commandType }}
          shard_index: ${{ matrix.index }}
          start_time: ${{ github.event.client_payload.startTime }}
          channel: ${{ github.event.client_payload.channel }}
          message: ${{ matrix.message }}
          token: ${{ github.event.client_payload.token }}
          link: ${{ matrix.link }}
      - name: Upload files
        if: ${{ success() }}
        id: upload
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh upload
      - name: Link has expired
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status == 'notfound' &&
            steps.download.outputs.status == '' &&
            steps.upload.outputs.status == ''
          }}
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh failure expired
      - name: Video file not found
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status == '' &&
            steps.download.outputs.status == 'notvideo' &&
            steps.upload.outputs.status == ''
          }}
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh failure notvideo
      - name: Uploaded file size exceeded
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status == '' &&
            steps.download.outputs.status == '' &&
            steps.upload.outputs.status == 'sizeover'
          }}
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh failure sizeover
      - name: Download timed out
        if: >-
          ${{
            failure() &&
            steps.link_status.outputs.status == '' &&
            steps.download.outputs.status == '' &&
            steps.upload.outputs.status == ''
          }}
        env:
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          SHARD_INDEX: ${{ matrix.index }}
        run: bash .github/scripts/run.sh failure timeout
      - name: Cleanup temp files
        if: ${{ always() && !cancelled() }}
        run: bash .github/scripts/run.sh cleanup
