name: Check and Convert Files
description: >
  Check total download size and convert oversized files to fit within the
  10 MB Discord attachment limit using two-pass libx265 + libopus encoding.
inputs:
  endpoint_url:
    description: Endpoint URL for progress callbacks
    required: true
  run_number:
    description: GitHub Actions run number
    required: true
  start_time:
    description: Start time of the workflow run
    required: true
  channel:
    description: Discord channel ID
    required: true
  message:
    description: Discord message ID
    required: true
  token:
    description: Discord interaction token
    required: true
  link:
    description: URL of the media being downloaded
    required: true
  command_type:
    description: Command type for thread-download callbacks (omit or leave empty for non-thread)
    required: false
    default: ''
  shard_index:
    description: Zero-padded matrix shard index (e.g. "01"); forwarded to conv_progress.sh as SHARD_INDEX so the bot can render "#N-XX" run numbers. Omit for non-thread runs.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check and Convert Files
      shell: bash
      env:
        ENDPOINT_URL: ${{ inputs.endpoint_url }}
        RUN_NUMBER: ${{ inputs.run_number }}
        START_TIME: ${{ inputs.start_time }}
        CHANNEL: ${{ inputs.channel }}
        MESSAGE: ${{ inputs.message }}
        TOKEN: ${{ inputs.token }}
        LINK: ${{ inputs.link }}
        COMMAND_TYPE: ${{ inputs.command_type }}
        SHARD_INDEX: ${{ inputs.shard_index }}
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/check_and_convert_files.sh"
